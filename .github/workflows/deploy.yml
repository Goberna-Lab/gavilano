name: Deploy

# Deploy de gavilano a vps2 (juandediosgavilano.com), INLINE (repo público: no puede usar el
# reusable privado de platform). El runner (vps2-gavilano-runner) corre EN vps2, así que el rsync
# al docroot es LOCAL (sin red). CI (ci.yml) ya valida lint+build en el PR; acá solo se hace el
# build del merge commit + rsync. Optimizado: sin lint redundante y sin cache:npm (en self-hosted
# el ~/.npm del runner ya persiste local; el cache de Actions sería un round-trip lento a GitHub).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gavilano
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gavilano]   # runner vps2-gavilano-runner (corre EN vps2)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node 20 (misma versión que CI). A propósito SIN `cache: npm`: ver nota de arriba.
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund   # install desde el ~/.npm local (sin red)
          npm run build                                   # base '/' por default (dominio raíz)

      - name: Guard dist + rsync local al docroot
        run: |
          set -euo pipefail
          DOCROOT=/srv/nexus-containers/gavilano/public
          # GUARD: rsync --delete con dist/ vacío borraría el sitio. Abortar si no hay archivos.
          [ -n "$(find dist -mindepth 1 -type f -print -quit)" ] || { echo "::error::dist/ vacío -> abort (no se toca el docroot)"; exit 1; }
          sudo rsync -rl --delete --chmod=D755,F644 dist/ "$DOCROOT/"
          echo "deploy OK -> $DOCROOT"
